{% set name = "workflows" %}
{% set version = "3.7" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 30ebf61e206e84ce687aa2ab43a3037ce66e7db78e5caa9ad12f9489acc097ba
build:
  noarch: python
  number: 0
  entry_points:
    - workflows.validate_recipe = workflows.recipe.validate:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - bidict
    - opentelemetry-api
    - opentelemetry-exporter-otlp-proto-http
    - opentelemetry-sdk
    - pika
    - python >={{ python_min }}
    - setuptools
    - stomp.py >=7.0

test:
  imports:
    - workflows
    - workflows.contrib
    - workflows.frontend
    - workflows.logging
    - workflows.recipe
    - workflows.services
    - workflows.transport
    - workflows.util
  commands:
    - pip check
    - workflows.validate_recipe --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.python.org/pypi/workflows
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Data processing in distributed environments
  doc_url: https://github.com/DiamondLightSource/python-workflows
  dev_url: https://github.com/DiamondLightSource/python-workflows

extra:
  recipe-maintainers:
    - anthchirp
    - ndevenish
    - rjgildea
